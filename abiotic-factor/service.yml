---
apiVersion: v1
kind: Service
metadata:
  name: abiotic-factor-svc
  namespace: abiotic-factor
spec:
  type: LoadBalancer
  selector:
    app: abiotic-factor
  externalTrafficPolicy: Local
  ports:
  - name: 7777-udp
    port: 7777
    protocol: UDP
    targetPort: 7777
  - name: 27015-udp
    port: 27015
    protocol: UDP
    targetPort: 27015
