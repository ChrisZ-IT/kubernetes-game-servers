---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terraria-game-configs
  namespace: terraria
data:
  serverconfig.txt: |
    #Load a world and automatically start the server.
    world=/home/serviceuser/.local/share/Terraria/Worlds/${SERVER_NAME}.wld

    #Creates a new world if none is found. World size is specified by: 1(small), 2(medium), and 3(large).
    autocreate=${WORLD_SIZE}

    #Sets the world seed when using autocreate(https://terraria.wiki.gg/wiki/World_Seed)
    #seed=AwesomeSeed

    #Sets the name of the world when using autocreate
    worldname=${SERVER_NAME}

    #Sets the difficulty of the world when using autocreate 0(classic), 1(expert), 2(master), 3(journey)
    difficulty=${DIFFICULTY}

    #Sets the max number of players allowed on a server. Value must be between 1 and 255
    maxplayers=${COUNT}

    #Set the port number
    port=${PORT}

    #Set the server password(Set in secret.yml)
    #password=p@55w0rd

    #Set the message of the day
    motd="${MOTD}"

    #Sets the folder where world files will be stored
    #worldpath=C:\Users\Defaults\My Documents\My Games\Terraria\Worlds\

    #The location of the banlist. Defaults to "banlist.txt" in the working directory.
    #banlist=/home/serviceuser/.local/share/Terraria/banlist.txt

    #Adds addition cheat protection.
    secure=1

    #Sets the server language from its language code.
    #English = en-US, German = de-DE, Italian = it-IT, French = fr-FR, Spanish = es-ES, Russian = ru-RU, Chinese = zh-Hans, Portuguese = pt-BR, Polish = pl-PL,
    #language=en-US

    #Automatically forward ports with uPNP
    #upnp=1

    #Reduces enemy skipping but increases bandwidth usage. The lower the number the less skipping will happen, but more data is sent. 0 is off.
    #npcstream=60

    #Default system priority 0:Realtime, 1:High, 2:AboveNormal, 3:Normal, 4:BelowNormal, 5:Idle
    priority=1

    #Journey mode power permissions for every individual power. 0: Locked for everyone, 1: Can only be changed by host, 2: Can be changed by everyone
    #journeypermission_time_setfrozen=2
    #journeypermission_time_setdawn=2
    #journeypermission_time_setnoon=2
    #journeypermission_time_setdusk=2
    #journeypermission_time_setmidnight=2
    #journeypermission_godmode=2
    #journeypermission_wind_setstrength=2
    #journeypermission_rain_setstrength=2
    #journeypermission_time_setspeed=2
    #journeypermission_rain_setfrozen=2
    #journeypermission_wind_setfrozen=2
    #journeypermission_increaseplacementrange=2
    #journeypermission_setdifficulty=2
    #journeypermission_biomespread_setfrozen=2
    #journeypermission_setspawnrate=2

  download.sh: |
    #!/usr/bin/env bash

    # Download latest vanilla server version
    ts_file=_DOLLAR_(curl https://www.terraria.org/api/get/dedicated-servers-names)
    my_array=(_DOLLAR_(echo _DOLLAR_ts_file | tr "," "\n"))
    zip_name=(_DOLLAR_(echo _DOLLAR_{my_array[0]} | sed 's/^.//' | sed 's/"//g'))
    download_path=https://www.terraria.org/api/download/pc-dedicated-server
    echo "Downloading: _DOLLAR_{zip_name}"
    mkdir _DOLLAR_{HOME}/temp
    curl -Lo _DOLLAR_{HOME}/temp/terraria_server.zip _DOLLAR_download_path/_DOLLAR_zip_name

    # extracts linux server files
    unzip _DOLLAR_{HOME}/temp/terraria_server.zip -d _DOLLAR_{HOME}/temp && \
    cp -r _DOLLAR_{HOME}/temp/*/Linux/* _DOLLAR_{HOME}/terraria-server
    chmod 755 _DOLLAR_{HOME}/terraria-server/TerrariaServer.bin.x86*

