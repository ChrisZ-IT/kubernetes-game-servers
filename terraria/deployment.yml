---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: terraria
  name: terraria
  namespace: terraria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraria
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: terraria
    spec:
      nodeSelector:
        requiredCPU: high
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
      volumes:
        - name: terraria-gamefiles-volume
          persistentVolumeClaim:
            claimName: terraria-gamefiles-pvc
        - name: terraria-saves-volume
          persistentVolumeClaim:
            claimName: terraria-saves-pvc
        - name: terraria-game-configs
          configMap:
            name: terraria-game-configs
            defaultMode: 0755
      initContainers:
      - name: init-downloader
        image: docker.io/chriszit/terraria-server-base:1.0.0
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c', '/config/download.sh']
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: terraria-gamefiles-volume
          mountPath: /home/serviceuser/terraria-server
        - name: terraria-game-configs
          mountPath: /config/
      containers:
      - name: terraria-server
        image: docker.io/chriszit/terraria-server-base:1.0.0
        imagePullPolicy: IfNotPresent
        workingDir: /home/serviceuser/terraria-server
        resources:
          limits:
            cpu: "3"
            memory: "8Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        ports:
        - containerPort: ${PORT}
          name: ${PORT}-tcp
          protocol: TCP
        - containerPort: ${PORT}
          name: ${PORT}-udp
          protocol: UDP
        env:
        - name: JOIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: terraria-server-password
              key: password
        command:
          - 'sh'
          - '-c'
          - |
            sleep 26000; /home/serviceuser/terraria-server/TerrariaServer.bin.x86_64 \
              -password _DOLLAR_JOIN_PASSWORD \
              -config /config/serverconfig.txt
        securityContext:
          runAsUser: 0
          # runAsUser: 1026
          # runAsGroup: 100
        volumeMounts:
        - name: terraria-gamefiles-volume
          mountPath: /home/serviceuser/terraria-server
        - name: terraria-saves-volume
          mountPath: /home/serviceuser/.local/share/Terraria
        - name: terraria-game-configs
          mountPath: /config/
